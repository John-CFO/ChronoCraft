############ CodeQL Security Analysis ############
# This workflow performs static application security testing (SAST)
# using GitHub CodeQL.
#
# It automatically runs on every push and pull request targeting
# the master branch to detect potential security vulnerabilities
# and coding issues in the JavaScript/TypeScript codebase.
#
# Steps:
# - Checkout repository
# - Initialize CodeQL
# - Automatically build the project
# - Perform CodeQL analysis
#
# Note: Findings are uploaded to GitHub Security for review.
###############################################

name: "CodeQL"

on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest

        permissions:
            security-events: write
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript

            - name: Autobuild
              uses: github/codeql-action/autobuild@v4

            - name: Analyze
              uses: github/codeql-action/analyze@v4
