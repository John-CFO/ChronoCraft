############ Firestore Rules Deployment ############
# This workflow automatically deploys Firestore Security Rules
# whenever changes are pushed to the master branch.
#
# Steps:
# - Checkout repository
# - Setup Node.js
# - Install Firebase CLI
# - Authenticate with Google Cloud
# - Deploy Firestore Security Rules
#
# Note: Only Firestore rules are deployed. No functions,
# hosting, storage rules, or other Firebase resources are affected.
###################################################

name: Deploy Firestore Rules

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project chrono-craft-worktime-manager
